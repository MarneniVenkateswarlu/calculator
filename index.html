<body>
<h1 style="
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    color: black;
">
    Calculator
</h1>

<div style="
    position: absolute;
    top: 35%;
    left:50%;
    width: 50%;
    height: 50%;
    background-color: lightblue;
    border: 3px solid black;
    transform: translate(-50%, -50%);
"><input
    style="
        color: black;
        font-size: 25px;
        position: absolute;
        left: 50%;
        width: 50%;
        height: 14%;
        transform: translate(-50%, -50%);
    "
    type="text"
    placeholder="Enter Value to Calculate"
    id="display"oninput="this.value=this.value.replace(/[^0-9.]/g,'')"

    
>
<br>
<br>
<button style="position: absolute;left:10%;top:15%;width:16%;height:15%;transform: translate(-50%, -50%);" onclick="display.value+='7'">7</button>
<button style="position: absolute;left:35%;top:15%;width:16%;height:15%;transform: translate(-50%, -50%);"onclick="display.value+='8'">8</button>
<button style="position: absolute;left:60%;top:15%;width:16%;height:15%;transform: translate(-50%, -50%);"onclick="display.value+='9'">9</button>
<button style="position: absolute;left:85%;top:15%;width:16%;height:15%;transform: translate(-50%, -50%);"onclick="display.value+='*'">*</button>
<br><br>

<button style="position: absolute;left:10%;top:33%;width:16%;height:15%;transform: translate(-50%, -50%);"onclick="display.value+='4'">4</button>
<button style="position: absolute;left:35%;top:33%;width:16%;height:15%;transform: translate(-50%, -50%);"onclick="display.value+='5'">5</button>
<button style="position: absolute;left:60%;top:33%;width:16%;height:15%;transform: translate(-50%, -50%);"onclick="display.value+='6'">6</button>
<button style="position: absolute;left:85%;top:33%;width:16%;height:15%;transform: translate(-50%, -50%);"onclick="display.value+='-'">-</button>
<br><br>

<button style="position: absolute;left:10%;top:51%;width:16%;height:15%;transform: translate(-50%, -50%);"onclick="display.value+='1'">1</button>
<button style="position: absolute;left:35%;top:51%;width:16%;height:15%;transform: translate(-50%, -50%);"onclick="display.value+='2'">2</button>
<button style="position: absolute;left:60%;top:51%;width:16%;height:15%;transform: translate(-50%, -50%);"onclick="display.value+='3'">3</button>
<button style="position: absolute;left:85%;top:51%;width:16%;height:15%;transform: translate(-50%, -50%);"onclick="display.value+='+'">+</button>
<br><br>

<button style="position: absolute;left:10%;top:69%;width:16%;height:15%;transform: translate(-50%, -50%);"onclick="display.value+='0'">0</button>
<button style="position: absolute;left:35%;top:69%;width:16%;height:15%;transform: translate(-50%, -50%);"onclick="display.value+='.'">.</button>
<button style="position: absolute;left:60%;top:69%;width:16%;height:15%;transform: translate(-50%, -50%);"onclick="display.value=''">C</button>

<button style="position: absolute;left:85%;top:69%;width:16%;height:15%;transform: translate(-50%, -50%);"onclick="display.value+='/'">/</button>
<br><br>
<button style="position: absolute;left:50%;top:87%;width:50%;height:15%;transform: translate(-50%, -50%);"onclick="display.value=eval(display.value)">=</button>



</div>
</body>
